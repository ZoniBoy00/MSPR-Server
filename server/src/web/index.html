<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSPR Pacific Rift Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Saira+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#overview"><b>MSPR</b><span>MotorStorm: Pacific Rift private server</span></a>
    <div class="status">
      <span class="pill off" id="pill"><i></i><span id="pill-text">Connecting</span></span>
      <button class="icon-btn" id="theme" type="button" aria-label="Toggle light and dark theme" title="Toggle theme">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <nav id="nav" aria-label="Sections">
      <a href="#overview" data-tab="overview">Overview</a>
      <a href="#testing" data-tab="testing">Testing</a>
      <a href="#live" data-tab="live">Live</a>
      <a href="#leaderboards" data-tab="leaderboards">Leaderboards</a>
      <a href="#drivers" data-tab="drivers">Drivers</a>
      <a href="#tracks" data-tab="tracks">Tracks</a>
      <a href="#races" data-tab="races">Races</a>
      <a href="#anticheat" data-tab="anticheat">Anti-cheat</a>
      <a href="#diagnostics" data-tab="diagnostics">Diagnostics</a>
      <a href="#server" data-tab="server">Server</a>
    </nav>
  </div>
</header>

<div class="wrap">
<main id="view" aria-live="polite"></main>
<footer id="foot"></footer>
<dialog id="race-dialog" aria-label="Race details"></dialog>
</div>

<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
